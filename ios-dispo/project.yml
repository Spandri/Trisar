# Xcode-Projekt fuer die native TRISAR Dispo-App (Nachbau von admin.trisar.de).
# Teilt Raster, Stil, Schrift, Anmeldung und Datenzugang mit ios-fahrer.
name: TrisarDispo
options:
  bundleIdPrefix: de.trisar
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "87"
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  TrisarDispo:
    type: application
    platform: iOS
    sources:
      - path: TrisarDispo
      # Datenformat fuer die Apple Watch (DispoUhrBruecke.swift schickt es).
      - path: TrisarDispoUhr/DispoUhrStand.swift
      - path: ../ios-fahrer/TrisarFahrer/Schrift
        buildPhase: resources
      - ../ios-fahrer/TrisarFahrer/App/Konfig.swift
      - ../ios-fahrer/TrisarFahrer/App/StartVideo.swift
      - path: ../ios-fahrer/TrisarFahrer/App/startvideo.mp4
        buildPhase: resources
      - ../ios-fahrer/TrisarFahrer/App/LaunchScreen.storyboard
      - ../ios-fahrer/TrisarFahrer/Dienste/Backend.swift
      - ../ios-fahrer/TrisarFahrer/Dienste/Anmeldung.swift
      - ../ios-fahrer/TrisarFahrer/Dienste/Push.swift
      - ../ios-fahrer/TrisarFahrer/Dienste/Fahrten.swift
      # Treffpunkt und Notiz beim Dienststart (Fahrten.swift haengt ihn an den Dienst).
      - ../ios-fahrer/TrisarFahrer/Dienste/DienstTreffpunkt.swift
      # Dienstreise: Verbindung Zug/Flug (train-validate, flight-validate), gleich wie in der Fahrer-App.
      - ../ios-fahrer/TrisarFahrer/Dienste/DienstreiseVerbindung.swift
      # Dienstreise: wo der Fahrer gerade ist (laufender Abschnitt, Position, Fahrzeug-Marker).
      - ../ios-fahrer/TrisarFahrer/Dienste/ReiseLage.swift
      - ../ios-fahrer/TrisarFahrer/Dienste/Orte.swift
      - ../ios-fahrer/TrisarFahrer/Dienste/Chat.swift
      - ../ios-fahrer/TrisarFahrer/Dienste/FahrtDetails.swift
      - ../ios-fahrer/TrisarFahrer/Dienste/GaesteAnzeige.swift
      - ../ios-fahrer/TrisarFahrer/Dienste/Routen.swift
      - ../ios-fahrer/TrisarFahrer/Dienste/FahrzeugDaten.swift
      - ../ios-fahrer/TrisarFahrer/Dienste/Stunden.swift
      - ../ios-fahrer/TrisarFahrer/Ansichten/Stil.swift
      - ../ios-fahrer/TrisarFahrer/Ansichten/Raster.swift
      - ../ios-fahrer/TrisarFahrer/Ansichten/FahrzeugSkizze.swift
      - ../ios-fahrer/TrisarFahrer/Ansichten/WebText.swift
      - ../ios-fahrer/TrisarFahrer/Ansichten/LoginAnsicht.swift
      - ../ios-fahrer/TrisarFahrer/Ansichten/FahrzeugKarte.swift
      # FahrzeugKarte kennt den 360-Grad-Satz (DrehSatz). Katalog und Bilder kommen vom Server (DrehKatalog, DrehBilder).
      - ../ios-fahrer/TrisarFahrer/Ansichten/FahrzeugDrehung.swift
      # Schadensstelle am drehbaren Auto (Ansicht mit Punkt im Schadensbericht)
      - ../ios-fahrer/TrisarFahrer/Ansichten/FahrzeugForm.swift
      # Schaden melden auf der Fahrzeugseite (DispoFahrzeugAnsicht), gleich wie in der Fahrer-App.
      - ../ios-fahrer/TrisarFahrer/Ansichten/SchadenMeldenAnsicht.swift
      - ../ios-fahrer/TrisarFahrer/Ansichten/KarteAnsicht.swift
      - ../ios-fahrer/TrisarFahrer/Ansichten/SupportAnsicht.swift
    dependencies:
      - package: Supabase
      - package: MapLibre
      # Apple-Watch-App (braucht watchOS in Xcode: Settings > Components).
      - target: TrisarDispoUhr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.trisar.dispo
        PRODUCT_NAME: TRISAR Dispo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # CarPlay (CarPlay/DispoCarPlaySzene.swift): Apple-Freigabe carplay-driving-task, auch auf dem Geraet.
    entitlements:
      path: TrisarDispo/TrisarDispo.entitlements
      properties:
        aps-environment: development
        com.apple.developer.nfc.readersession.formats:
          - TAG
        com.apple.developer.carplay-driving-task: true
    info:
      path: TrisarDispo/Info.plist
      properties:
        NFCReaderUsageDescription: NFC-Tags an den OBD-Trackern beschreiben und auslesen.
        # Schaden melden auf der Fahrzeugseite (SchadenMeldenAnsicht aus der Fahrer-App).
        NSCameraUsageDescription: "TRISAR braucht die Kamera, damit du Schäden am Fahrzeug fotografieren kannst."
        NSPhotoLibraryUsageDescription: "TRISAR braucht Zugriff auf deine Fotos, damit du Bilder eines Schadens anhängen kannst."
        # Blauer Punkt auf der Dispo-Karte und "Ankuenfte bei mir" (Dienste/EigenerStandort.swift, AnkunftMelden.swift).
        NSLocationWhenInUseUsageDescription: Dein Standort wird auf der Dispo-Karte gezeigt und für „Ankünfte bei mir“ genutzt.
        # Voice-Modus im KI-Assistenten (Ansichten/SprachModus.swift).
        NSMicrophoneUsageDescription: Das Mikrofon wird im Sprachmodus des KI-Assistenten genutzt, damit du mit ihm sprechen kannst.
        NSSpeechRecognitionUsageDescription: Deine Sprache wird im Sprachmodus des KI-Assistenten in Text umgewandelt und an den Assistenten geschickt.
        CFBundleDisplayName: TRISAR Dispo
        # Erstes Bild des Startvideos, damit es ohne Schwarz in die Animation geht.
        UILaunchStoryboardName: LaunchScreen
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - SpaceGrotesk.ttf
        # CarPlay-Szene (CarPlay/DispoCarPlaySzene.swift). Das Handy-Fenster kommt weiter aus SwiftUI.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).DispoCarPlaySzene

  # Apple-Watch-App: Uebersicht (Fahrer je Zustand, Fahrten ohne Fahrer), Fahrer, Fahrten.
  # Daten vom iPhone (WatchConnectivity), keine eigene Anmeldung.
  TrisarDispoUhr:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: TrisarDispoUhr
      - path: ../ios-fahrer/TrisarFahrerUhr/UhrStil.swift
      # Komplikation auch in der App (Vorschau mit -uhrZeige komplikation).
      - path: TrisarDispoUhrWidget/DispoKomplikationAnsicht.swift
      - path: ../ios-fahrer/TrisarFahrer/Schrift
        buildPhase: resources
    dependencies:
      # Komplikation (WidgetKit), in die Uhr-App eingebettet.
      - target: TrisarDispoUhrWidget
    entitlements:
      path: TrisarDispoUhr/TrisarDispoUhr.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.trisar.dispo.uhr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.trisar.dispo.watchkitapp
        PRODUCT_NAME: TRISAR Dispo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dispo
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: de.trisar.dispo
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
    info:
      path: TrisarDispoUhr/Info.plist
      properties:
        CFBundleDisplayName: Dispo
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        WKCompanionAppBundleIdentifier: de.trisar.dispo
        WKApplication: true
        UIAppFonts:
          - SpaceGrotesk.ttf
        # TEST (13.11.): Sprachmodus bleibt bei ausgehendem Bildschirm aktiv (WKExtendedRuntimeSession,
        # Typ self-care, nur solange der Sprachmodus offen ist). Fuer den App Store vorher pruefen.
        WKBackgroundModes:
          - self-care

  # Komplikation der Dispo-Uhr: „N ohne Fahrer · N ohne Signal“ (rechteckig, rund, Zeile, Ecke).
  # Zahlen kommen ueber die App Group group.de.trisar.dispo.uhr von der Uhr-App.
  TrisarDispoUhrWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: TrisarDispoUhrWidget
      - path: TrisarDispoUhr/DispoUhrStand.swift
      - path: ../ios-fahrer/TrisarFahrerUhr/UhrStil.swift
      - path: ../ios-fahrer/TrisarFahrer/Schrift
        buildPhase: resources
    entitlements:
      path: TrisarDispoUhrWidget/TrisarDispoUhrWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.trisar.dispo.uhr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.trisar.dispo.watchkitapp.komplikation
        PRODUCT_NAME: TrisarDispoKomplikation
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dispo
        SKIP_INSTALL: YES
    info:
      path: TrisarDispoUhrWidget/Info.plist
      properties:
        CFBundleDisplayName: Dispo
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - SpaceGrotesk.ttf
