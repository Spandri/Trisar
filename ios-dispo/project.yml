# Xcode-Projekt fuer die native TRISAR Dispo-App (Nachbau von admin.trisar.de).
# Teilt Raster, Stil, Schrift, Anmeldung und Datenzugang mit ios-fahrer.
name: TrisarDispo
options:
  bundleIdPrefix: de.trisar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  TrisarDispo:
    type: application
    platform: iOS
    sources:
      - path: TrisarDispo
      - path: ../ios-fahrer/TrisarFahrer/Schrift
        buildPhase: resources
      - ../ios-fahrer/TrisarFahrer/App/Konfig.swift
      - ../ios-fahrer/TrisarFahrer/Dienste/Backend.swift
      - ../ios-fahrer/TrisarFahrer/Dienste/Anmeldung.swift
      - ../ios-fahrer/TrisarFahrer/Dienste/Fahrten.swift
      - ../ios-fahrer/TrisarFahrer/Dienste/Chat.swift
      - ../ios-fahrer/TrisarFahrer/Dienste/FahrtDetails.swift
      - ../ios-fahrer/TrisarFahrer/Dienste/Routen.swift
      - ../ios-fahrer/TrisarFahrer/Dienste/FahrzeugDaten.swift
      - ../ios-fahrer/TrisarFahrer/Ansichten/Stil.swift
      - ../ios-fahrer/TrisarFahrer/Ansichten/Raster.swift
      - ../ios-fahrer/TrisarFahrer/Ansichten/WebText.swift
      - ../ios-fahrer/TrisarFahrer/Ansichten/LoginAnsicht.swift
      - ../ios-fahrer/TrisarFahrer/Ansichten/FahrzeugKarte.swift
      - ../ios-fahrer/TrisarFahrer/Ansichten/KarteAnsicht.swift
      - ../ios-fahrer/TrisarFahrer/Ansichten/SupportAnsicht.swift
    dependencies:
      - package: Supabase
      - package: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.trisar.dispo
        PRODUCT_NAME: TRISAR Dispo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: TrisarDispo/Info.plist
      properties:
        CFBundleDisplayName: TRISAR Dispo
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - SpaceGrotesk.ttf
